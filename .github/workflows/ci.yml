name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (editable, base deps only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run import smoke tests
        run: pytest tests/test_imports.py -v
