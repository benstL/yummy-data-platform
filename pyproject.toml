[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yummy-data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "recipe-scrapers>=15.0",
    "protego>=0.3",
    "pydantic>=2.0",
    "duckdb>=1.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
    "brotli>=1.1",
]

[project.optional-dependencies]
eufic = ["selenium>=4.0"]
kaggle = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "extract*", "transform*"]
exclude = ["data*", "tests*"]