name: 'yummy'
version: '1.0.0'
config-version: 2

profile: 'yummy'

model-paths: ["models"]
test-paths:  ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Per-model materialization is declared via {{ config() }} in each SQL file:
#   stg_*              → view   (virtual queries, no local storage)
#   yummy_recommendations → external  (COPY … TO s3://yummy/gold/ on MinIO)
models:
  yummy: {}
